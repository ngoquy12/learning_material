<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #f8fafc; color: #0f172a; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    }
    .scene-root {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    /* Light Grid Pattern Overlay */
    .scene-root::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.07) 1.5px, transparent 1.5px);
      background-size: 36px 36px; opacity: 0.7; pointer-events: none;
    }

    /* Fixed Top-Right Rikkei Logo Standard */
    .rikkei-logo {
      position: absolute; top: 45px; right: 80px; height: 50px; z-index: 100;
      object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.06));
    }

    /* Top Left Title Header */
    .scene-title-header {
      position: absolute; top: 45px; left: 80px; right: 260px; z-index: 10;
      text-align: left !important;
    }
    .main-title {
      font-family: 'Be Vietnam Pro', sans-serif; font-size: 42px; font-weight: 800; color: #ba252a; line-height: 1.25;
      letter-spacing: -0.02em; text-align: left !important; margin: 0; padding: 0;
    }

    /* Main Stage Layout: Full HD 1760px Container */
    .main-stage {
      position: absolute; top: 135px; bottom: 40px; left: 80px; right: 80px; z-index: 5;
      display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;
      text-align: left !important; font-family: 'Be Vietnam Pro', sans-serif;
    }

    .content-box {
      width: 100%; max-width: 1760px; height: 100%;
      text-align: left !important;
    }

    /* Split Container: 2-Column Layout for Card + Standalone Code Panel */
    .split-container {
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; width: 100%; height: 100%;
      align-items: stretch;
    }

    /* Full Width Container for Single Card */
    .card-full {
      width: 100%; background: #ffffff; border: 1.5px solid #e2e8f0; border-left: 8px solid #ba252a;
      border-radius: 18px; padding: 36px 44px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
      text-align: left !important; display: flex; flex-direction: column; justify-content: flex-start; gap: 24px;
    }

    /* Left Card in Split Layout */
    .card-left {
      width: 100%; background: #ffffff; border: 1.5px solid #e2e8f0; border-left: 8px solid #ba252a;
      border-radius: 18px; padding: 32px 36px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
      text-align: left !important; display: flex; flex-direction: column; justify-content: flex-start; gap: 20px;
    }

    /* Card Badge & Subtitle Header */
    .card-header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 8px;
    }
    .card-badge {
      background: #ba252a; color: #ffffff; font-weight: 800; font-size: 20px;
      width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(186, 37, 42, 0.25); flex-shrink: 0;
    }
    .card-title {
      font-size: 28px; font-weight: 700; color: #0f172a; line-height: 1.35; margin: 0;
    }

    /* Bullet List Styling */
    .bullet-list {
      list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 18px;
      text-align: left !important;
    }
    .bullet-list li {
      font-size: 24px; line-height: 1.55 !important; color: #1e293b;
      display: flex; align-items: flex-start; font-family: 'Be Vietnam Pro', sans-serif;
      text-align: left !important; background: transparent; border: none; padding: 0; box-shadow: none;
    }

    /* Standalone Code Panel (VS Code Dark Slate - 1-Level Container, NO Outer White Box) */
    .code-panel-right {
      width: 100%; background: #0f172a; border: 1.5px solid #1e293b; border-radius: 18px;
      overflow: hidden; box-shadow: 0 16px 36px rgba(15, 23, 42, 0.18);
      display: flex; flex-direction: column; height: 100%;
    }
    .code-header-bar {
      background: #1e293b; padding: 14px 22px; border-bottom: 1.5px solid #334155;
      display: flex; align-items: center; justify-content: space-between;
    }
    .mac-dots {
      display: flex; align-items: center; gap: 8px;
    }
    .mac-dots .dot {
      width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    }
    .mac-dots .dot.red { background: #ff5f56; }
    .mac-dots .dot.yellow { background: #ffbd2e; }
    .mac-dots .dot.green { background: #27c93f; }
    .code-filename {
      font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 600; color: #38bdf8;
    }

    /* Code Body */
    .code-body {
      padding: 28px 32px; background: #0f172a; flex: 1; margin: 0 !important;
      overflow-x: auto; white-space: pre !important; word-break: normal !important;
      font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 23px; line-height: 1.7 !important;
      color: #f8fafc !important; tab-size: 4; -moz-tab-size: 4; text-align: left !important;
    }
    .code-body code {
      background: transparent !important; border: none !important; padding: 0 !important;
      font-family: inherit; font-size: inherit; color: inherit; box-shadow: none !important;
    }

    /* VS Code Syntax Highlighting Standard */
    .kw { color: #ff7b72 !important; font-weight: 700 !important; } /* Keyword -> Bright Red */
    .fn { color: #79c0ff !important; font-weight: 700 !important; } /* Function -> Bright Cyan/Blue */
    .str { color: #7ee787 !important; } /* String -> Bright Emerald Green */
    .cm { color: #8b949e !important; font-style: italic !important; } /* Comment -> Slate Gray */
    .num { color: #ffa657 !important; font-weight: 600 !important; } /* Number -> Amber Orange */

    .desc-text {
      font-size: 30px; font-weight: 600; color: #334155; text-align: left !important; line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="scene-02" class="scene-root clip" data-composition-id="scene-02" data-start="0" data-duration="1.55" data-track-index="0">
    
    <!-- Fixed Top-Right Logo (Same row as title) -->
    <img src="https://rikkei.edu.vn/wp-content/uploads/2025/09/Logo.png" alt="Rikkei Academy" class="rikkei-logo clip" data-start="0" data-duration="1.55" data-track-index="5">

    <!-- Top Left Title Header -->
    <div class="scene-title-header clip" data-start="0" data-duration="1.55" data-track-index="10">
      <h1 class="main-title">Demo 2</h1>
    </div>

    <!-- Main Stage Content Slot (Dynamic Grid/Cards/Code) -->
    <div class="main-stage clip" data-start="0.5" data-duration="1.55" data-track-index="20">
      <div class="content-box">
        <div class="split-container">
  <div class="card-left">
    <div class="card-header">
      <span class="card-badge">📌</span>
      <h2 class="card-title">Demo 2</h2>
    </div>
    <ul class="bullet-list">
      
    </ul>
  </div>
  <div class="diagram-panel-right" style="width: 100%; background: #ffffff; border: 1.5px solid #e2e8f0; border-top: 5px solid #ba252a; border-radius: 18px; padding: 24px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05); display: flex; align-items: center; justify-content: center;">
    <pre class="mermaid" style="font-family: 'Be Vietnam Pro', sans-serif !important; width: 100%;">
graph TD
X-->Y
    </pre>
  </div>
</div>
      </div>
    </div>

  </div>

  <script>
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({
        startOnLoad: true,
        theme: 'neutral',
        themeVariables: {
          primaryColor: '#fff5f5',
          primaryBorderColor: '#ba252a',
          primaryTextColor: '#0f172a',
          lineColor: '#ba252a',
          fontFamily: 'Be Vietnam Pro'
        }
      });
    }
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene-02"] = tl;

    const _buildTimer = setInterval(function() {
      const root = document.getElementById("scene-02");
      if (!root) return;
      clearInterval(_buildTimer);

      const dur = parseFloat(root.getAttribute("data-duration")) || parseFloat("1.55");
      const durEnd = Math.max(0.1, dur - 0.8);

      // GSAP Animation Timeline
      tl.set(".clip", { autoAlpha: 1 }, 0);
      tl.set(".main-title", { autoAlpha: 0, x: -30 }, 0);
      tl.set(".main-stage", { autoAlpha: 0, y: 25 }, 0);

      tl.to(".main-title", { autoAlpha: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.2);
      tl.to(".main-stage", { autoAlpha: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.8);

      const items = root.querySelectorAll(".content-box > *, .card-left, .card-full, .code-panel-right, .bullet-list li");
      if (items.length > 0) {
        const step = Math.max(0.5, (durEnd - 2.5) / items.length);
        items.forEach((item, idx) => {
          tl.fromTo(item, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.5 + idx * step);
        });
      }

      tl.to("#scene-02", { autoAlpha: 0, duration: 0.8 }, durEnd);
      tl.set({}, {}, dur);
    }, 50);
  </script>
</body>
</html>
