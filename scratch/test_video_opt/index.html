<!doctype html>
<html lang="vi">
  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      .clip { position: absolute; visibility: hidden; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="test_opt_slug"
      data-start="0"
      data-duration="24.12"
      data-width="1920"
      data-height="1080"
    >
      <!-- Intro Composition Clip (9.24s) -->
      <div class="clip" data-composition-src="src/compositions/Intro.html"
           data-composition-id="scene-intro" data-start="0" data-duration="9.24" data-track-index="0"></div>

      <!-- Scene Clips -->
      <div class="clip" data-composition-src="src/compositions/Scene_01.html" data-composition-id="scene-01" data-start="9.24" data-duration="1.18" data-track-index="1"></div>
      <div class="clip" data-composition-src="src/compositions/Scene_02.html" data-composition-id="scene-02" data-start="10.42" data-duration="1.55" data-track-index="2"></div>

      <!-- Outro Composition Clip (12.15s) -->

           data-composition-id="scene-outro" data-start="11.97" data-duration="12.15" data-track-index="0"></div>

      <!-- Background Music Kênh 99 -->
      <audio id="bg-music"
             data-start="0"
             data-duration="24.12"
             data-track-index="99"
             data-volume="0.12"
             data-loop="true"
             src="assets/bg-music.mp3"></audio>

      <!-- TTS Audio Elements -->
      <audio id="tts-01" data-start="9.24" data-duration="1.18" data-track-index="20" data-volume="1" src="assets/tts/Scene_01.wav"></audio>
      <audio id="tts-02" data-start="10.42" data-duration="1.55" data-track-index="21" data-volume="1" src="assets/tts/Scene_02.wav"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["test_opt_slug"] = tl;
    </script>
  </body>
</html>
