<!--
  COMPONENT: architecture.html (Architecture & Data Flow Diagram)
  SLOTS: {{slot_scene_n}}, {{slot_dur}}, {{slot_intro_title}},
         {{slot_node1_icon}}, {{slot_node1_title}}, {{slot_node1_desc}},
         {{slot_node2_icon}}, {{slot_node2_title}}, {{slot_node2_desc}},
         {{slot_node3_icon}}, {{slot_node3_title}}, {{slot_node3_desc}},
         {{slot_t1}}, {{slot_t2}}, {{slot_t3}}, {{slot_gsap_extra}}
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0f1117; font-family: 'Inter', sans-serif;
      background-image: radial-gradient(rgba(255,255,255,0.15) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
    body::before {
      content:''; position:absolute; border-radius:50%; filter:blur(180px); z-index:-1;
      top:-150px; left:20%; width:800px; height:600px; background:rgba(56,189,248,0.08);
    }
    body::after {
      content:''; position:absolute; border-radius:50%; filter:blur(180px); z-index:-1;
      bottom:-150px; right:20%; width:800px; height:600px; background:rgba(168,85,247,0.08);
    }
    .scene-root { width: 1920px; height: 1080px; position: relative; }
    [id^="scene-"] { width: 1920px; height: 1080px; position: relative; }

    .intro-title {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 72px; font-weight: 800; color: #e6edf3; z-index: 100;
      text-align: center; white-space: nowrap; text-shadow: 0 0 60px rgba(56,189,248,0.4);
    }
    .section-badge {
      position: absolute; top: 28px; right: 40px;
      background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3);
      border-radius: 999px; padding: 8px 24px;
      font-size: 18px; font-weight: 600; color: #38bdf8; letter-spacing: 0.5px;
    }

    .arch-layout {
      position: absolute; top: 180px; left: 100px;
      width: 1720px; height: 780px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 0;
    }
    .arch-node {
      flex: 0 0 460px; height: 560px;
      background: rgba(15,17,23,0.85);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 44px 36px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; justify-content: center; gap: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative; backdrop-filter: blur(12px);
    }
    .node-icon-wrapper {
      width: 100px; height: 100px; border-radius: 24px;
      background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(168,85,247,0.15));
      border: 1px solid rgba(56,189,248,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }
    .node-title { font-size: 30px; font-weight: 800; color: #e6edf3; line-height: 1.3; }
    .node-desc { font-size: 20px; color: #8b949e; line-height: 1.6; }

    .arch-arrow {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;
      position: relative;
    }
    .arrow-line {
      width: 100%; height: 4px;
      background: linear-gradient(90deg, rgba(56,189,248,0.6), rgba(168,85,247,0.6));
      border-radius: 2px; position: relative;
    }
    .arrow-line::after {
      content: ''; position: absolute; right: 0; top: -6px;
      width: 0; height: 0;
      border-top: 8px solid transparent; border-bottom: 8px solid transparent;
      border-left: 14px solid rgba(168,85,247,0.9);
    }
    .arrow-label {
      font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 600;
      color: #38bdf8; background: rgba(56,189,248,0.1);
      padding: 4px 14px; border-radius: 999px; border: 1px solid rgba(56,189,248,0.25);
    }
  </style>
</head>
<body>
  <div id="scene-{{slot_scene_n}}" class="clip scene-root"
       data-composition-id="scene-{{slot_scene_n}}"
       data-start="0" data-duration="{{slot_dur}}" data-track-index="0">

    <div class="section-badge clip" data-start="0" data-duration="{{slot_dur}}" data-track-index="1">
      🏛️ Architecture Diagram
    </div>

    <div id="intro-title-{{slot_scene_n}}" class="intro-title clip"
         data-start="0" data-duration="{{slot_dur}}" data-track-index="100">
      {{slot_intro_title}}
    </div>

    <div class="arch-layout clip" data-start="0" data-duration="{{slot_dur}}" data-track-index="2">
      <!-- Node 1 -->
      <div id="node-1-{{slot_scene_n}}" class="arch-node">
        <div class="node-icon-wrapper">{{slot_node1_icon}}</div>
        <div class="node-title">{{slot_node1_title}}</div>
        <div class="node-desc">{{slot_node1_desc}}</div>
      </div>

      <!-- Arrow 1 -> 2 -->
      <div id="arrow-1-{{slot_scene_n}}" class="arch-arrow">
        <div class="arrow-label">Data Request</div>
        <div class="arrow-line"></div>
      </div>

      <!-- Node 2 (Core) -->
      <div id="node-2-{{slot_scene_n}}" class="arch-node" style="border-color: rgba(56,189,248,0.35);">
        <div class="node-icon-wrapper" style="background: linear-gradient(135deg, rgba(63,185,80,0.2), rgba(56,189,248,0.2)); border-color: rgba(63,185,80,0.4);">{{slot_node2_icon}}</div>
        <div class="node-title">{{slot_node2_title}}</div>
        <div class="node-desc">{{slot_node2_desc}}</div>
      </div>

      <!-- Arrow 2 -> 3 -->
      <div id="arrow-2-{{slot_scene_n}}" class="arch-arrow">
        <div class="arrow-label">Process &amp; Return</div>
        <div class="arrow-line"></div>
      </div>

      <!-- Node 3 -->
      <div id="node-3-{{slot_scene_n}}" class="arch-node">
        <div class="node-icon-wrapper">{{slot_node3_icon}}</div>
        <div class="node-title">{{slot_node3_title}}</div>
        <div class="node-desc">{{slot_node3_desc}}</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const sceneId = "scene-{{slot_scene_n}}";
    window.__timelines[sceneId] = tl;

    const _buildTimer = setInterval(function() {
      if (!document.getElementById(sceneId)) return;
      clearInterval(_buildTimer);

      const t1 = parseFloat("{{slot_t1}}") || 4.0;
      const t2 = parseFloat("{{slot_t2}}") || 4.8;
      const t3 = parseFloat("{{slot_t3}}") || 5.6;
      const dur = parseFloat("{{slot_dur}}") || 30.0;

      tl.set(".clip", { autoAlpha: 1 }, 0);
      tl.set("#intro-title-{{slot_scene_n}}", { autoAlpha: 0, scale: 0.8 }, 0);
      tl.set("#node-1-{{slot_scene_n}}", { autoAlpha: 0, x: -60 }, 0);
      tl.set("#arrow-1-{{slot_scene_n}}", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center" }, 0);
      tl.set("#node-2-{{slot_scene_n}}", { autoAlpha: 0, y: 40, scale: 0.95 }, 0);
      tl.set("#arrow-2-{{slot_scene_n}}", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center" }, 0);
      tl.set("#node-3-{{slot_scene_n}}", { autoAlpha: 0, x: 60 }, 0);

      tl.to("#intro-title-{{slot_scene_n}}", { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.2);
      tl.to("#intro-title-{{slot_scene_n}}", { scale: 0.38, x: -760, y: -460, duration: 0.7, ease: "power3.inOut" }, 3.2);

      tl.to("#node-1-{{slot_scene_n}}", { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, t1);
      tl.to("#arrow-1-{{slot_scene_n}}", { autoAlpha: 1, scaleX: 1, duration: 0.4, ease: "power2.inOut" }, t1 + 0.4);
      tl.to("#node-2-{{slot_scene_n}}", { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.2)" }, t2);
      tl.to("#arrow-2-{{slot_scene_n}}", { autoAlpha: 1, scaleX: 1, duration: 0.4, ease: "power2.inOut" }, t2 + 0.4);
      /* {{slot_gsap_extra}} */

      // Clean scene fade-out before transition
      tl.to("#scene-{{slot_scene_n}}", { autoAlpha: 0, duration: 0.8, ease: "power2.inOut" }, Math.max(0, dur - 0.8));
      tl.set({}, {}, dur);
    }, 50);
  </script>
</body>
</html>
