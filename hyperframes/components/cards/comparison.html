<!--
  COMPONENT: comparison.html
  SLOTS: {{slot_scene_n}}, {{slot_dur}}, {{slot_intro_title}},
         {{slot_left_title}}, {{slot_left_body}}, {{slot_left_icon}},
         {{slot_right_title}}, {{slot_right_body}}, {{slot_right_icon}},
         {{slot_t1}}, {{slot_t2}}, {{slot_gsap_extra}}
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0f1117; font-family: 'Inter', sans-serif;
      background-image: radial-gradient(rgba(255,255,255,0.15) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
    body::before {
      content:''; position:absolute; border-radius:50%; filter:blur(150px); z-index:-1;
      top:-100px; left:-100px; width:700px; height:700px;
      background:rgba(248,81,73,0.08);
    }
    body::after {
      content:''; position:absolute; border-radius:50%; filter:blur(150px); z-index:-1;
      bottom:-100px; right:-100px; width:700px; height:700px;
      background:rgba(63,185,80,0.08);
    }
    .scene-root { width: 1920px; height: 1080px; position: relative; }
    [id^="scene-"] { width: 1920px; height: 1080px; position: relative; }
    .intro-title {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:72px; font-weight:800; color:#e6edf3; z-index:100; text-align:center;
      white-space:nowrap; text-shadow:0 0 60px rgba(255,255,255,0.2);
    }
    .vs-label {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:48px; font-weight:900; color:#e6edf3; z-index:10;
      background: rgba(15,17,23,0.9); border-radius:50%;
      width:80px; height:80px; display:flex; align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,0.12);
    }
    .layout {
      position:absolute; top:80px; left:40px;
      display:flex; gap:0; width:1840px; height:960px; align-items:center;
    }
    .side-card {
      flex:1; height:720px; border-radius:20px; padding:56px 48px;
      display:flex; flex-direction:column; gap:28px; justify-content:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .left-card {
      background:linear-gradient(135deg, rgba(248,81,73,0.12) 0%, rgba(248,81,73,0.04) 100%);
      border:1px solid rgba(248,81,73,0.25); border-radius:20px 0 0 20px;
    }
    .right-card {
      background:linear-gradient(135deg, rgba(63,185,80,0.04) 0%, rgba(63,185,80,0.12) 100%);
      border:1px solid rgba(63,185,80,0.25); border-radius:0 20px 20px 0;
    }
    .card-icon { font-size:52px; }
    .card-badge {
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 20px; border-radius:999px; font-size:16px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.5px; width:fit-content;
    }
    .bad-badge { background:rgba(248,81,73,0.15); color:#f85149; border:1px solid rgba(248,81,73,0.3); }
    .good-badge { background:rgba(63,185,80,0.15); color:#3fb950; border:1px solid rgba(63,185,80,0.3); }
    .card-title { font-size:34px; font-weight:800; color:#ffffff; line-height:1.2; }
    .card-body { font-size:22px; line-height:1.7; color:#f0f6fc; font-weight:500; }
    .separator { width:4px; background:rgba(255,255,255,0.06); height:720px; flex-shrink:0; }
  </style>
</head>
<body>
  <div id="scene-{{slot_scene_n}}" class="clip"
       data-composition-id="scene-{{slot_scene_n}}"
       data-start="0" data-duration="{{slot_dur}}" data-track-index="0">

    <div id="intro-title-{{slot_scene_n}}" class="intro-title clip"
         data-start="0" data-duration="{{slot_dur}}" data-track-index="100">
      {{slot_intro_title}}
    </div>

    <div class="layout clip" data-start="0" data-duration="{{slot_dur}}" data-track-index="2">
      <!-- Left: Bad/Old -->
      <div id="left-card-{{slot_scene_n}}" class="side-card left-card">
        <div class="card-icon">{{slot_left_icon}}</div>
        <div class="card-badge bad-badge" style="display:flex;align-items:center;gap:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          {{slot_left_title}}
        </div>
        <div class="card-body">{{slot_left_body}}</div>
      </div>

      <div class="separator"></div>

      <!-- VS divider -->
      <div class="vs-label">VS</div>

      <!-- Right: Good/New -->
      <div id="right-card-{{slot_scene_n}}" class="side-card right-card">
        <div class="card-icon">{{slot_right_icon}}</div>
        <div class="card-badge good-badge" style="display:flex;align-items:center;gap:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          {{slot_right_title}}
        </div>
        <div class="card-body">{{slot_right_body}}</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const sceneId = "scene-{{slot_scene_n}}";
    window.__timelines[sceneId] = tl;

    const _buildTimer = setInterval(function() {
      if (!document.getElementById(sceneId)) return;
      clearInterval(_buildTimer);

      const t1 = parseFloat("{{slot_t1}}") || 4.0;
      const t2 = parseFloat("{{slot_t2}}") || 4.5;
      const dur = parseFloat("{{slot_dur}}") || 30.0;

      tl.set(".clip", { autoAlpha: 1 }, 0);
      tl.set("#intro-title-{{slot_scene_n}}", { autoAlpha: 0, scale: 0.8 }, 0);
      tl.set("#left-card-{{slot_scene_n}}", { autoAlpha: 0, x: -80 }, 0);
      tl.set("#right-card-{{slot_scene_n}}", { autoAlpha: 0, x: 80 }, 0);

      tl.to("#intro-title-{{slot_scene_n}}", { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.2);
      tl.to("#intro-title-{{slot_scene_n}}", { scale: 0.38, x: -760, y: -460, duration: 0.7, ease: "power3.inOut" }, 3.2);

      tl.to("#left-card-{{slot_scene_n}}", { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, t1);
      tl.to("#right-card-{{slot_scene_n}}", { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, t2);

      /* {{slot_gsap_extra}} */

      // Clean scene fade-out before transition
      tl.to("#scene-{{slot_scene_n}}", { autoAlpha: 0, duration: 0.8, ease: "power2.inOut" }, Math.max(0, dur - 0.8));
      tl.set({}, {}, dur);
    }, 50);
  </script>
</body>
</html>
