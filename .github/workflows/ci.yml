name: CI Pipeline (Quality & Automated Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          ruff check core agents config cli tests --select E9,F63,F7,F82

      - name: Run Flake8 Syntax Check
        run: |
          flake8 core agents config cli tests --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pydantic pyyaml

      - name: Run Pytest Suite (kèm đo độ phủ)
        env:
          PYTHONPATH: .
          SEMANTIC_CACHE_ENABLED: "false"
          # Đẩy toàn bộ DB runtime vào thư mục tạm của runner: test tuyệt đối không
          # được để lại file .db nào trong cây mã nguồn (xem core/paths.py).
          STORAGE_DIR: ${{ runner.temp }}/elearning-storage
        run: |
          pytest -v --tb=short tests/ \
            --cov=core --cov=agents --cov=cli \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=38

      # Ngưỡng tách riêng cho core/ — nơi chứa engine, state và các cổng kiểm định.
      # Dùng lại dữ liệu đo của bước trên, KHÔNG chạy lại test.
      #
      # Mốc khi dựng cổng (2026-08-24): core 50%, tổng 36%.
      # Nâng ngưỡng sau nhóm P2 (core 56%, tổng 41%) theo đúng quy ước bên dưới.
      # Ngưỡng đặt thấp hơn mốc vài điểm để không đỏ CI ngay, nhưng chặn được tụt
      # dốc. Quy ước: mỗi lần độ phủ thực tế vượt ngưỡng >5 điểm thì NÂNG ngưỡng
      # lên, nếu không cổng này sẽ dần trở thành trang trí.
      - name: Kiểm tra ngưỡng độ phủ riêng cho core/
        run: |
          coverage report --include="core/*" --fail-under=53

      - name: Lưu báo cáo độ phủ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  docker:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: learning-material-factory:latest
