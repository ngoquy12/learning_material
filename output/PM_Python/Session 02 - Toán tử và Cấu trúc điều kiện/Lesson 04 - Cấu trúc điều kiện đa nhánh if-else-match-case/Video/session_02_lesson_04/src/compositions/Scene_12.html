<!--
  COMPONENT: comparison.html
  SLOTS: 12, 21.09, Tổng kết hướng dẫn áp dụng,
         Phương pháp Cũ, Tổng kết lại, cấu trúc rẽ nhánh giúp điều khiển chương trình xử lý chính xác dựa trên đầu vào, ⚠️,
         Phương pháp Mới, Hãy dùng cấu trúc mátch-kết khi cần tối ưu hóa các điều kiện xử lý đa luồng phức tạp dựa trên hằng số và thuộc tính tĩnh, 🚀,
         4.0, 7.9, 
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0f1117; font-family: 'Inter', sans-serif;
      background-image: radial-gradient(rgba(255,255,255,0.15) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
    body::before {
      content:''; position:absolute; border-radius:50%; filter:blur(150px); z-index:-1;
      top:-100px; left:-100px; width:700px; height:700px;
      background:rgba(248,81,73,0.08);
    }
    body::after {
      content:''; position:absolute; border-radius:50%; filter:blur(150px); z-index:-1;
      bottom:-100px; right:-100px; width:700px; height:700px;
      background:rgba(63,185,80,0.08);
    }
    .scene-root { width: 1920px; height: 1080px; position: relative; }
    [id^="scene-"] { width: 1920px; height: 1080px; position: relative; }
    .intro-title {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:72px; font-weight:800; color:#e6edf3; z-index:100; text-align:center;
      white-space:nowrap; text-shadow:0 0 60px rgba(255,255,255,0.2);
    }
    .vs-label {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:48px; font-weight:900; color:#e6edf3; z-index:10;
      background: rgba(15,17,23,0.9); border-radius:50%;
      width:80px; height:80px; display:flex; align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,0.12);
    }
    .layout {
      position:absolute; top:80px; left:40px;
      display:flex; gap:0; width:1840px; height:960px; align-items:center;
    }
    .side-card {
      flex:1; height:720px; border-radius:20px; padding:56px 48px;
      display:flex; flex-direction:column; gap:28px; justify-content:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .left-card {
      background:linear-gradient(135deg, rgba(248,81,73,0.12) 0%, rgba(248,81,73,0.04) 100%);
      border:1px solid rgba(248,81,73,0.25); border-radius:20px 0 0 20px;
    }
    .right-card {
      background:linear-gradient(135deg, rgba(63,185,80,0.04) 0%, rgba(63,185,80,0.12) 100%);
      border:1px solid rgba(63,185,80,0.25); border-radius:0 20px 20px 0;
    }
    .card-icon { font-size:52px; }
    .card-badge {
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 20px; border-radius:999px; font-size:16px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.5px; width:fit-content;
    }
    .bad-badge { background:rgba(248,81,73,0.15); color:#f85149; border:1px solid rgba(248,81,73,0.3); }
    .good-badge { background:rgba(63,185,80,0.15); color:#3fb950; border:1px solid rgba(63,185,80,0.3); }
    .card-title { font-size:34px; font-weight:800; color:#e6edf3; line-height:1.2; }
    .card-body { font-size:22px; line-height:1.7; color:#c9d1d9; }
    .separator { width:4px; background:rgba(255,255,255,0.06); height:720px; flex-shrink:0; }
  </style>
</head>
<body>
  <div id="scene-12" class="clip"
       data-composition-id="scene-12"
       data-start="0" data-duration="21.09" data-track-index="0">

    <div id="intro-title-12" class="intro-title clip"
         data-start="0" data-duration="21.09" data-track-index="100">
      Tổng kết hướng dẫn áp dụng
    </div>

    <div class="layout clip" data-start="0" data-duration="21.09" data-track-index="2">
      <!-- Left: Bad/Old -->
      <div id="left-card-12" class="side-card left-card">
        <div class="card-icon">⚠️</div>
        <div class="card-badge bad-badge">❌ Phương pháp Cũ</div>
        <div class="card-body">Tổng kết lại, cấu trúc rẽ nhánh giúp điều khiển chương trình xử lý chính xác dựa trên đầu vào</div>
      </div>

      <div class="separator"></div>

      <!-- VS divider -->
      <div class="vs-label">VS</div>

      <!-- Right: Good/New -->
      <div id="right-card-12" class="side-card right-card">
        <div class="card-icon">🚀</div>
        <div class="card-badge good-badge">✅ Phương pháp Mới</div>
        <div class="card-body">Hãy dùng cấu trúc mátch-kết khi cần tối ưu hóa các điều kiện xử lý đa luồng phức tạp dựa trên hằng số và thuộc tính tĩnh</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const sceneId = "scene-12";
    window.__timelines[sceneId] = tl;

    const _buildTimer = setInterval(function() {
      if (!document.getElementById(sceneId)) return;
      clearInterval(_buildTimer);

      const t1 = parseFloat("4.0") || 4.0;
      const t2 = parseFloat("7.9") || 4.5;
      const dur = parseFloat("21.09") || 30.0;

      tl.set(".clip", { autoAlpha: 1 }, 0);
      tl.set("#intro-title-12", { autoAlpha: 0, scale: 0.8 }, 0);
      tl.set("#left-card-12", { autoAlpha: 0, x: -80 }, 0);
      tl.set("#right-card-12", { autoAlpha: 0, x: 80 }, 0);

      tl.to("#intro-title-12", { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.2);
      tl.to("#intro-title-12", { scale: 0.38, x: -760, y: -460, duration: 0.7, ease: "power3.inOut" }, 3.2);

      tl.to("#left-card-12", { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, t1);
      tl.to("#right-card-12", { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, t2);

      /*  */
      tl.set({}, {}, dur);
    }, 50);
  </script>
</body>
</html>
