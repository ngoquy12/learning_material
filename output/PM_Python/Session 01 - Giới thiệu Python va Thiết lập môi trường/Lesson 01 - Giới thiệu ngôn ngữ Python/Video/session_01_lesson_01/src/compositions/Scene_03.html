<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0f1117; font-family: "Inter", sans-serif;
        background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px);
        background-size: 32px 32px;
      }
      .scene-root { width: 1920px; height: 1080px; position: relative; }
      
      /* Scene Header Bar */
      .scene-header {
        position: absolute; top: 48px; left: 60px; right: 60px;
        display: flex; align-items: center; gap: 20px; z-index: 10;
        opacity: 0; visibility: hidden;
      }
      .header-badge {
        background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4);
        color: #38bdf8; font-size: 15px; font-weight: 800; padding: 6px 18px;
        border-radius: 999px; letter-spacing: 1px; text-transform: uppercase;
      }
      .scene-title {
        font-size: 36px; font-weight: 800; color: #ffffff;
        text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      }

      /* Main Layout */
      .main-layout {
        position: absolute; top: 150px; left: 60px; right: 60px; bottom: 50px;
        display: flex; gap: 36px; align-items: center;
      }
      .concept-card {
        flex: 0 0 34%; background: rgba(22, 27, 34, 0.92);
        border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
        padding: 44px; height: 680px; display: flex; flex-direction: column;
        gap: 20px; justify-content: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        opacity: 0; visibility: hidden;
      }
      .concept-card h3 {
        font-size: 28px; font-weight: 800; color: #ffffff;
        border-bottom: 2px solid rgba(56, 189, 248, 0.5); padding-bottom: 14px;
      }
      .concept-card p { font-size: 21px; line-height: 1.75; color: #f0f6fc; font-weight: 500; }
      
      .arch-diagram {
        flex: 1; height: 680px; background: rgba(22, 27, 34, 0.92);
        border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
        padding: 40px; display: flex; flex-direction: column; justify-content: center;
        gap: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        opacity: 0; visibility: hidden;
      }
      .arch-node {
        background: #161b22; border: 1.5px solid rgba(56, 189, 248, 0.3);
        border-radius: 16px; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between;
      }
      .arch-title { font-size: 22px; font-weight: 800; color: #ffffff; }
      .arch-desc { font-size: 18px; color: #38bdf8; font-weight: 600; }
      .arch-arrow { display: flex; justify-content: center; color: #38bdf8; }
    </style>
  </head>
  <body>
    <div id="scene-03" class="clip scene-root" data-composition-id="scene-03" data-start="0" data-duration="23.41" data-track-index="0">
      <!-- Header Bar -->
      <div id="header-03" class="scene-header">
        <div class="header-badge">ARCHITECTURE</div>
        <h1 class="scene-title">Cơ Chế Biên Dịch Lai &amp; Máy Ảo PVM</h1>
      </div>

      <div class="main-layout">
        <div id="concept-card-03" class="concept-card">
          <h3>Ngôn Ngữ Thông Dịch Lai</h3>
          <p>Tự động chuyển mã nguồn <strong>.py</strong> thành <strong>Bytecode (.pyc)</strong> và thực thi qua <strong>PVM</strong> linh hoạt trên mọi HĐH.</p>
        </div>

        <div id="arch-diag-03" class="arch-diagram">
          <div class="arch-node">
            <div class="arch-title">1. Mã Nguồn Tiêu Chuẩn (.py)</div>
            <div class="arch-desc">Source Code</div>
          </div>
          <div class="arch-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          </div>
          <div class="arch-node">
            <div class="arch-title">2. Bộ Biên Dịch &amp; Bytecode (.pyc)</div>
            <div class="arch-desc">Python Compiler</div>
          </div>
          <div class="arch-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          </div>
          <div class="arch-node">
            <div class="arch-title">3. Máy Ảo Python (PVM)</div>
            <div class="arch-desc">Execution Engine</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene-03"] = tl;

      const _buildTimer = setInterval(function() {
        if (!document.getElementById("scene-03")) return;
        clearInterval(_buildTimer);

        const dur = 23.41;
        tl.set(".clip", { autoAlpha: 1 }, 0);

        tl.to("#header-03", { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.3);
        tl.to("#concept-card-03", { autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 3.5);
        tl.to("#arch-diag-03", { autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 10.5);

        // Clean scene fade-out before exit
        tl.to("#scene-03", { autoAlpha: 0, duration: 0.8, ease: "power2.inOut" }, Math.max(0, dur - 0.8));
        tl.set({}, {}, dur);
      }, 50);
    </script>
  </body>
</html>
