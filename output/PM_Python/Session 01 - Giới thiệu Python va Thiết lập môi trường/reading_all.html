      .viewport-panel {

        height: 100%;
        background: #ffffff;

      .lesson-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        opacity: 0;
        pointer-events: none;
        z-index: 1;

    <script>
      function hideIframeHeader(iframe) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc && doc.head && !doc.getElementById("hide-inner-hdr")) {
            const style = doc.createElement("style");
            style.id = "hide-inner-hdr";
            style.textContent =
              "#sticky-header, header, .sticky-nav { display: none !important; } body { padding-top: 0 !important; }";
            doc.head.appendChild(style);
          }
        } catch (e) {}
      }

      function switchLesson(idx) {
        const btns = document.querySelectorAll(".sidebar-nav-btn");
        const frames = document.querySelectorAll(".lesson-frame");

        btns.forEach((btn, i) => {
          if (i + 1 === idx) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        frames.forEach((frame, i) => {
          if (i + 1 === idx) {
            frame.classList.add("active");
            hideIframeHeader(frame);
            try {
              if (
                frame.contentWindow &&
                frame.contentWindow.mermaid &&
                typeof frame.contentWindow.mermaid.run === "function"
              ) {
                frame.contentWindow.mermaid.run();
              }
            } catch (e) {}
          } else {
            frame.classList.remove("active");
          }
        });
      }
    </script>
