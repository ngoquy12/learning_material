<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{LESSON_TITLE}} - Studio Teleprompter</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            montserrat: ["Montserrat", "Inter", "sans-serif"],
            mono: ["JetBrains Mono", "Fira Code", "monospace"],
          },
          colors: {
            rikkei: {
              red: "#be111c",
              darkred: "#90000a",
              dark: "#0f172a",
              bgDark: "#0b0f19",
              cardDark: "#151d30",
              borderDark: "#1e293b",
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Teleprompter Text Styling */
    .teleprompter-text {
      transition: font-size 0.2s ease, line-height 0.2s ease;
    }
    .highlight-emphasis {
      color: #be111c;
      font-weight: 800;
    }
    .dark .highlight-emphasis {
      color: #ff4d5a;
      font-weight: 800;
    }
    .highlight-keyword {
      color: #0284c7;
      font-weight: 800;
    }
    .dark .highlight-keyword {
      color: #38bdf8;
      font-weight: 800;
    }
    .pause-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72em;
      font-weight: 700;
      padding: 0.1em 0.45em;
      margin: 0 0.25em;
      border-radius: 0.375rem;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
      line-height: 1.2;
    }
    .dark .pause-tag {
      background-color: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }

    /* Glassmorphism utility */
    .glass-header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="font-sans antialiased bg-slate-100 dark:bg-rikkei-bgDark text-slate-900 dark:text-slate-100 h-screen overflow-hidden flex flex-col transition-colors duration-300">

  <!-- Header / Studio Topbar -->
  <header class="bg-white/95 dark:bg-rikkei-cardDark/95 border-b border-slate-200 dark:border-slate-800 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm glass-header select-none">
    <!-- Left Logo & Session Meta -->
    <div class="flex items-center gap-3">
      <img src="https://rikkei.edu.vn/wp-content/uploads/2025/09/Logo.png" alt="Rikkei Academy Logo" class="h-8 md:h-9 object-contain">
      <span class="h-6 w-[1px] bg-slate-200 dark:bg-slate-700 hidden sm:block"></span>
      <div class="hidden sm:flex flex-col">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/80 text-rikkei-red dark:text-rose-400 text-[11px] font-bold">
            <span class="w-2 h-2 rounded-full bg-rikkei-red animate-pulse"></span>
            Chế độ Studio Quay
          </span>
          <span class="text-xs text-slate-500 dark:text-slate-400 font-mono font-medium">Session 01 • Python Core</span>
        </div>
        <h1 class="text-sm font-bold text-slate-800 dark:text-slate-100 font-montserrat mt-0.5 truncate max-w-md">
          {{LESSON_TITLE}}
        </h1>
      </div>
    </div>

    <!-- Center/Right Master Control Bar -->
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Auto-scroll Teleprompter Controller -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold">
        <button id="btn-toggle-scroll" onclick="toggleAutoScroll()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-rikkei-red hover:bg-rikkei-darkred active:scale-95 text-white font-bold transition-all shadow-sm" title="Bắt đầu / Tạm dừng tự động cuộn">
          <i id="icon-scroll-state" class="ph-bold ph-play text-sm"></i>
          <span id="text-scroll-state" class="hidden sm:inline">Tự động cuộn</span>
        </button>
        <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>
        <span class="px-1 text-slate-500 dark:text-slate-400 text-[11px] font-mono hidden md:inline">Tốc độ:</span>
        <button onclick="setScrollSpeed(1)" id="speed-1" class="speed-btn px-2 py-1 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 font-bold transition-all bg-white dark:bg-slate-700 shadow-xs">1x</button>
        <button onclick="setScrollSpeed(1.5)" id="speed-1.5" class="speed-btn px-2 py-1 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 font-bold transition-all">1.5x</button>
        <button onclick="setScrollSpeed(2)" id="speed-2" class="speed-btn px-2 py-1 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 font-bold transition-all">2x</button>
      </div>

      <!-- Teleprompter Font Size Scale -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold gap-0.5">
        <button onclick="changeFontSize(-2)" class="w-8 h-8 rounded-lg hover:bg-white dark:hover:bg-slate-700 active:scale-95 transition-all text-slate-700 dark:text-slate-300 flex items-center justify-center font-bold" title="Giảm cỡ chữ">
          <i class="ph-bold ph-text-minus text-base"></i>
        </button>
        <span id="font-size-display" class="px-1.5 text-slate-600 dark:text-slate-300 font-mono text-xs font-semibold">20px</span>
        <button onclick="changeFontSize(2)" class="w-8 h-8 rounded-lg hover:bg-white dark:hover:bg-slate-700 active:scale-95 transition-all text-slate-700 dark:text-slate-300 flex items-center justify-center font-bold" title="Tăng cỡ chữ">
          <i class="ph-bold ph-text-plus text-base"></i>
        </button>
      </div>

      <!-- Dark/Light Teleprompter Mode Toggle -->
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 flex items-center justify-center transition-all shadow-xs" title="Chuyển chế độ phòng thu Sáng/Tối">
        <i id="theme-toggle-icon" class="ph-bold ph-moon text-lg"></i>
      </button>

      <!-- Copy All Script -->
      <button onclick="copyFullScript()" class="hidden lg:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs border border-slate-200 dark:border-slate-700 transition-all">
        <i class="ph-bold ph-copy text-sm text-rikkei-red dark:text-rose-400"></i>
        <span>Sao chép kịch bản</span>
      </button>
    </div>
  </header>

  <!-- Studio Main Dashboard Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Left Navigation & Timeline Sidebar -->
    <aside class="w-80 bg-white dark:bg-rikkei-cardDark border-r border-slate-200 dark:border-slate-800 hidden md:flex flex-col shrink-0 select-none transition-colors duration-300">
      
      <!-- Lesson Tabs Filter -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/50">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
            <i class="ph-bold ph-books text-rikkei-red dark:text-rose-400"></i>
            Danh sách bài học
          </span>
          <span class="text-[11px] font-mono text-slate-500 dark:text-slate-400">5 bài</span>
        </div>
        <div class="grid grid-cols-5 gap-1.5 bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl">
          <a href="video_script_lesson_1.html" class="py-1.5 rounded-lg text-center font-bold text-xs bg-rikkei-red text-white shadow-xs transition-all">1</a>
          <a href="video_script_lesson_2.html" class="py-1.5 rounded-lg text-center font-bold text-xs text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700 transition-all">2</a>
          <a href="video_script_lesson_3.html" class="py-1.5 rounded-lg text-center font-bold text-xs text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700 transition-all">3</a>
          <a href="video_script_lesson_4.html" class="py-1.5 rounded-lg text-center font-bold text-xs text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700 transition-all">4</a>
          <a href="video_script_lesson_5.html" class="py-1.5 rounded-lg text-center font-bold text-xs text-slate-600 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-700 transition-all">5</a>
        </div>
      </div>

      <!-- Teleprompter Progress Bar -->
      <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-rikkei-cardDark flex flex-col gap-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500 dark:text-slate-400 font-medium">Tiến độ kịch bản:</span>
          <span id="scroll-progress-percent" class="font-mono font-bold text-rikkei-red dark:text-rose-400">0%</span>
        </div>
        <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="scroll-progress-bar" class="bg-rikkei-red h-full w-0 transition-all duration-150 rounded-full"></div>
        </div>
      </div>

      <!-- Slide Steps Timeline Navigation -->
      <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar">
        <span class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block px-2 my-1">
          Mạch phân cảnh studio
        </span>

        {{NAV_ITEMS}}
      </div>
    </aside>

    <!-- Right Workspace Panel (Studio Teleprompter Cards) -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 flex flex-col gap-6 custom-scrollbar" id="teleprompter-container">
      
      {{SCENE_BLOCKS}}
    </main>

  </div>

  <!-- JavaScript Controls & Interactive Engine -->
  <script>
    // State management
    let isAutoScrolling = false;
    let scrollSpeed = 1; // 1x = ~1.5px/frame, 1.5x = ~2.25px/frame, 2x = ~3px/frame
    let baseFontSize = 20;
    let scrollAnimationId = null;

    const container = document.getElementById("teleprompter-container");
    const scenes = document.querySelectorAll(".scene-block");
    const navItems = document.querySelectorAll(".nav-item");
    const scrollProgressBar = document.getElementById("scroll-progress-bar");
    const scrollProgressPercent = document.getElementById("scroll-progress-percent");

    // Scroll handling to highlight active navigation item & update progress bar
    container.addEventListener("scroll", () => {
      let currentIdx = 0;
      let minDiff = Infinity;
      const containerTop = container.getBoundingClientRect().top;

      scenes.forEach((scene, idx) => {
        const diff = Math.abs(scene.getBoundingClientRect().top - containerTop - 24);
        if (diff < minDiff) {
          minDiff = diff;
          currentIdx = idx;
        }
      });

      // Update sidebar nav highlights
      navItems.forEach((item, idx) => {
        if (idx === currentIdx) {
          item.classList.add("border-rikkei-red", "bg-rose-50/70", "dark:bg-rose-950/40", "text-rikkei-red", "dark:text-rose-400", "font-bold", "shadow-xs");
          item.classList.remove("border-transparent", "text-slate-700", "dark:text-slate-300");
        } else {
          item.classList.remove("border-rikkei-red", "bg-rose-50/70", "dark:bg-rose-950/40", "text-rikkei-red", "dark:text-rose-400", "font-bold", "shadow-xs");
          item.classList.add("border-transparent", "text-slate-700", "dark:text-slate-300");
        }
      });

      // Calculate progress percentage
      const maxScroll = container.scrollHeight - container.clientHeight;
      const progress = maxScroll > 0 ? Math.round((container.scrollTop / maxScroll) * 100) : 0;
      scrollProgressBar.style.width = progress + "%";
      scrollProgressPercent.textContent = progress + "%";
    });

    // Scroll smoothly to specific scene
    function scrollToScene(idx) {
      const scene = document.getElementById("scene-" + idx);
      if (scene) {
        scene.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Auto-scroll engine
    function toggleAutoScroll() {
      isAutoScrolling = !isAutoScrolling;
      const btn = document.getElementById("btn-toggle-scroll");
      const icon = document.getElementById("icon-scroll-state");
      const text = document.getElementById("text-scroll-state");

      if (isAutoScrolling) {
        icon.className = "ph-bold ph-pause text-sm";
        if (text) text.textContent = "Tạm dừng";
        btn.classList.replace("bg-rikkei-red", "bg-slate-700");
        stepScroll();
      } else {
        icon.className = "ph-bold ph-play text-sm";
        if (text) text.textContent = "Tự động cuộn";
        btn.classList.replace("bg-slate-700", "bg-rikkei-red");
        if (scrollAnimationId) cancelAnimationFrame(scrollAnimationId);
      }
    }

    function stepScroll() {
      if (!isAutoScrolling) return;
      const maxScroll = container.scrollHeight - container.clientHeight;
      if (container.scrollTop >= maxScroll) {
        toggleAutoScroll(); // Stop at bottom
        return;
      }
      container.scrollTop += (1.2 * scrollSpeed);
      scrollAnimationId = requestAnimationFrame(stepScroll);
    }

    function setScrollSpeed(speed) {
      scrollSpeed = speed;
      document.querySelectorAll(".speed-btn").forEach(btn => {
        btn.classList.remove("bg-white", "dark:bg-slate-700", "shadow-xs");
      });
      const activeBtn = document.getElementById("speed-" + speed);
      if (activeBtn) {
        activeBtn.classList.add("bg-white", "dark:bg-slate-700", "shadow-xs");
      }
    }

    // Font size controls
    function changeFontSize(delta) {
      baseFontSize += delta;
      if (baseFontSize < 14) baseFontSize = 14;
      if (baseFontSize > 36) baseFontSize = 36;
      
      document.getElementById("font-size-display").textContent = baseFontSize + "px";
      document.querySelectorAll(".teleprompter-text").forEach(el => {
        el.style.fontSize = baseFontSize + "px";
      });
    }

    // Dark Mode Toggle
    function toggleDarkMode() {
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-toggle-icon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        html.classList.add("light");
        themeIcon.className = "ph-bold ph-moon text-lg";
      } else {
        html.classList.remove("light");
        html.classList.add("dark");
        themeIcon.className = "ph-bold ph-sun text-lg text-amber-400";
      }
    }

    // Copy Code Helper
    function copyCode(btn) {
      const pre = btn.closest('div').querySelector('code');
      const textToCopy = pre ? pre.textContent : '';
      navigator.clipboard.writeText(textToCopy).then(() => {
        const origHTML = btn.innerHTML;
        btn.innerHTML = '<i class="ph-bold ph-check text-emerald-400"></i> Đã chép!';
        setTimeout(() => {
          btn.innerHTML = origHTML;
        }, 2000);
      });
    }

    // Copy Full Teleprompter Script Helper
    function copyFullScript() {
      let fullScript = "";
      document.querySelectorAll(".scene-block").forEach((scene, i) => {
        const title = scene.querySelector("h3") ? scene.querySelector("h3").innerText.trim() : `Phân cảnh ${i + 1}`;
        const speech = scene.querySelector(".teleprompter-text") ? scene.querySelector(".teleprompter-text").innerText.trim() : "";
        fullScript += `--- PHÂN CẢNH ${i + 1}: ${title} ---\n${speech}\n\n`;
      });

      navigator.clipboard.writeText(fullScript).then(() => {
        alert("Đã sao chép toàn bộ kịch bản lời thoại Studio Teleprompter vào bộ nhớ tạm!");
      });
    }
  </script>

</body>
</html>
